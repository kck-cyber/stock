[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-stock-assistant-pro"
version = "0.2.0"
description = "Morning Stock Assistant Pro"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "kck-cyber" }
]

license = { text = "Private" }

keywords = [
    "stock",
    "investment",
    "ai",
    "portfolio",
    "korea",
    "nasdaq"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "PySide6>=6.8.0",
    "SQLAlchemy>=2.0.36",
    "pandas>=2.2.3",
    "numpy>=2.2.0",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "schedule>=1.2.2",
    "loguru>=0.7.2",
    "matplotlib>=3.10.0",
    "mplfinance>=0.12.10b0",
    "yfinance>=0.2.54",
    "pykrx>=1.0.48",
    "feedparser>=6.0.11",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]